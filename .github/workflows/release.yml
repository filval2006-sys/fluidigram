# Costruisce gli installer di Fluidigram per macOS e Windows e li allega a una bozza di release su GitHub.
#
# Come si usa: dalla cartella del progetto
#   npm run version:set 0.2.0      # aggiorna la versione nei tre file che la contengono
#   git commit -am "Versione 0.2.0" && git tag v0.2.0 && git push --follow-tags
# Dopo qualche minuto, in GitHub → Releases trovi la bozza con i file da scaricare: controllala e premi "Publish".
# Si può anche lanciare a mano da Actions → Release → Run workflow (in quel caso i file restano negli "artifacts" del lavoro).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple Silicon + Intel)
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - os: windows-latest
            label: Windows
            rust_targets: ''
            args: ''
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # non si distribuisce una versione con i test rossi
      - run: npm test

      - name: Costruisci l'app e crea la bozza di release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma e notarizzazione macOS (facoltative, richiedono un account Apple Developer):
          # aggiungi questi segreti al repository e togli il commento alle righe.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Fluidigram ${{ github.ref_name }}'
          releaseBody: |
            ## Download
            **macOS** (Apple Silicon and Intel) — download the `.pkg`, a guided installer (you can install for everyone, only for you, or on another disk).
            **Windows 10/11** — download the `-setup.exe` and follow the wizard: install for you or for everyone, choose the folder, Start menu folder and desktop shortcut.

            ### First launch
            The app is not code-signed/notarized yet, so your system warns you the first time. This is expected, not a virus.
            - **macOS** ("Apple could not verify Fluidigram is free of malware"): open the app once and press *Done*, then **System Settings → Privacy & Security → Open Anyway**. Alternatively, before opening it, run `xattr -cr /Applications/Fluidigram.app` in Terminal.
            - **Windows** ("Windows protected your PC"): *More info* → *Run anyway*.

            Works fully offline. The interface is in Italian; exported drawings can be in Italian or English.

            ## Installazione
            **macOS** — scarica il `.pkg` (installer guidato: per tutti, solo per te o su un altro disco). La prima volta: Impostazioni di Sistema → Privacy e sicurezza → **Apri comunque** (oppure `xattr -cr /Applications/Fluidigram.app` da Terminale).
            **Windows** — scarica il `-setup.exe` e segui la procedura guidata (per te o per tutti, cartella, menu Start, collegamento sul desktop). Se compare «Windows ha protetto il PC»: *Ulteriori informazioni* → *Esegui comunque*.

            Created by Filippo Valentini.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # installer guidato per Mac (.pkg): benvenuto, scelta di dove installare, installazione, riepilogo
      - name: Crea l'installer guidato per macOS (.pkg)
        if: ${{ runner.os == 'macOS' }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p pkg-out
          scripts/make-pkg.sh src-tauri/target/universal-apple-darwin/release/bundle/macos/Fluidigram.app "$VERSION" "pkg-out/Fluidigram_${VERSION}_macOS.pkg"
          ls -la pkg-out

      - name: Aggiungi il .pkg alla bozza di release
        if: ${{ runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          for f in pkg-out/*.pkg; do
            gh api --method POST -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=$(basename "$f")" \
              --input "$f"
          done

      # nelle esecuzioni manuali (senza tag) gli installer restano scaricabili da qui
      - name: Salva gli installer come artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: fluidigram-${{ runner.os }}
          if-no-files-found: error
          path: |
            pkg-out/*.pkg
            src-tauri/target/release/bundle/nsis/*.exe
