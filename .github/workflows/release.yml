# Costruisce gli installer di Fluidigram per macOS e Windows e li allega a una bozza di release su GitHub.
#
# Come si usa: dalla cartella del progetto
#   npm run version:set 0.2.0      # aggiorna la versione nei tre file che la contengono
#   git commit -am "Versione 0.2.0" && git tag v0.2.0 && git push --follow-tags
# Dopo qualche minuto, in GitHub → Releases trovi la bozza con i file da scaricare: controllala e premi "Publish".
# Si può anche lanciare a mano da Actions → Release → Run workflow (in quel caso i file restano negli "artifacts" del lavoro).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple Silicon + Intel)
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - os: windows-latest
            label: Windows
            rust_targets: ''
            args: ''
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # non si distribuisce una versione con i test rossi
      - run: npm test

      - name: Costruisci l'app e crea la bozza di release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma e notarizzazione macOS (facoltative, richiedono un account Apple Developer):
          # aggiungi questi segreti al repository e togli il commento alle righe.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Fluidigram ${{ github.ref_name }}'
          releaseBody: |
            ## Download
            **macOS** (Apple Silicon and Intel) — download the `.dmg`, open it and drag Fluidigram to Applications. The first time, right-click the app → *Open* (the app is not code-signed yet). If macOS says it is damaged, run `xattr -cr /Applications/Fluidigram.app` in Terminal.
            **Windows 10/11** — download the `-setup.exe` and run it (no administrator rights needed). If "Windows protected your PC" appears, press *More info* → *Run anyway*.

            Works fully offline. The interface is in Italian; exported drawings can be in Italian or English.

            ## Installazione
            **macOS** — scarica il `.dmg`, aprilo e trascina Fluidigram in Applicazioni. La prima volta fai clic destro sull'app → *Apri* (non è ancora firmata da Apple).
            **Windows** — scarica il `-setup.exe` ed eseguilo. Se compare «Windows ha protetto il PC»: *Ulteriori informazioni* → *Esegui comunque*.

            Created by Filippo Valentini.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # nelle esecuzioni manuali (senza tag) gli installer restano scaricabili da qui
      - name: Salva gli installer come artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: fluidigram-${{ runner.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
