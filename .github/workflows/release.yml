# Builds the Fluidigram installers for macOS and Windows and attaches them to a draft release on GitHub.
#
# How to use it: from the project folder
#   npm run version:set 0.2.0      # updates the version in the three files that contain it
#   git commit -am "Versione 0.2.0" && git tag v0.2.0 && git push --follow-tags
# After a few minutes, in GitHub → Releases you find the draft with the files to download: review it and press "Publish".
# It can also be started by hand from Actions → Release → Run workflow (in that case the files stay in the job's "artifacts").
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple Silicon + Intel)
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - os: windows-latest
            label: Windows
            rust_targets: ''
            args: ''
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # a version with failing tests is never distributed
      - run: npm test

      # the release body comes from docs/releases/<tag>.md + docs/release-install.md (see scripts/release-notes.sh)
      - name: Compose the release notes
        id: notes
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            scripts/release-notes.sh "${GITHUB_REF_NAME}"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build the app and create the draft release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # key that signs the in-app updates (not an Apple/Microsoft certificate): see docs/DISTRIBUTION.md
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS signing and notarization (optional, they need an Apple Developer account):
          # add these secrets to the repository and uncomment the lines.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Fluidigram ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # guided installer for Mac (.pkg): welcome, choice of where to install, installation, summary
      - name: Create the guided macOS installer (.pkg)
        if: ${{ runner.os == 'macOS' }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p pkg-out
          scripts/make-pkg.sh src-tauri/target/universal-apple-darwin/release/bundle/macos/Fluidigram.app "$VERSION" "pkg-out/Fluidigram_${VERSION}_macOS.pkg"
          ls -la pkg-out

      - name: Add the .pkg to the draft release
        if: ${{ runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          for f in pkg-out/*.pkg; do
            gh api --method POST -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=$(basename "$f")" \
              --input "$f"
          done

      # in manual runs (without a tag) the installers can be downloaded from here
      - name: Save the installers as artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: fluidigram-${{ runner.os }}
          if-no-files-found: error
          path: |
            pkg-out/*.pkg
            src-tauri/target/release/bundle/nsis/*.exe
