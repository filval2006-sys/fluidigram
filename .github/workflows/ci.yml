# Automatic checks on every push and pull request: types, lint, tests (including the core/modules separation), UI build and Rust formatting.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Rust formatting
        run: cargo fmt --check
        working-directory: src-tauri
